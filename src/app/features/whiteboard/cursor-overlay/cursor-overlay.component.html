<div class="overlay" aria-hidden="true">
  @for (cursor of remoteUsers.cursors(); track cursor.id) {
    <div
      class="cursor"
      [style.transform]="'translate(' + cursor.x * viewport.size().width + 'px, ' + cursor.y * viewport.size().height + 'px)'"
      [style.visibility]="cursor.hidden ? 'hidden' : 'visible'"
    >
      <svg class="arrow" width="20" height="20" viewBox="0 0 20 20" [style.fill]="cursor.color">
        <path d="M2 1.5L17.5 8.5L10 10.5L7.5 18L2 1.5Z" stroke="white" stroke-width="1" stroke-linejoin="round" />
      </svg>
      <span class="nametag" [style.background]="cursor.color">{{ cursor.name }}</span>
    </div>
  }
</div>
